<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#a855f7" fill-opacity=".16"/></pattern>
<radialGradient id="g1" cx="100%" cy="0%" r="80%"><stop offset="0" stop-color="#7b2ff7" stop-opacity=".38"/><stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0%" cy="100%" r="70%"><stop offset="0" stop-color="#00c853" stop-opacity=".12"/><stop offset="1" stop-color="#00c853" stop-opacity="0"/></radialGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#a855f7" stop-opacity="0"/><stop offset=".5" stop-color="#a855f7" stop-opacity=".8"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="170"><stop offset="0" stop-color="#a855f7"/><stop offset=".45" stop-color="#ff4fd8"/><stop offset=".75" stop-color="#2a2150"/><stop offset="1" stop-color="#00c853"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 450.0 85.0" to="360 450.0 85.0" dur="10s" repeatCount="indefinite"/></linearGradient></defs><style>
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.gl{animation:p 4s ease-in-out infinite}@keyframes p{50%{opacity:.5}}
.dot{animation:d 1.6s ease-in-out infinite}@keyframes d{50%{opacity:.25}}
.f{animation:f 3.2s ease-in-out infinite}@keyframes f{50%{transform:translateY(-4px)}}
.tw{animation:t 3s ease-in-out infinite}@keyframes t{50%{opacity:.15}}
.fl{animation:fl 9s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px);opacity:.2}}
</style>
<rect x="1" y="1" width="898" height="168" rx="24" fill="#0f1320"/><rect x="1" y="1" width="898" height="168" rx="24" fill="url(#dots)"/>
<rect x="1" y="1" width="898" height="168" rx="24" fill="url(#g1)"/><rect x="1" y="1" width="898" height="168" rx="24" fill="url(#g2)"/>
<rect x="1" y="1" width="898" height="168" rx="24" fill="none" stroke="url(#bd)" stroke-width="2.5"/>
<text class="f" x="450" y="62" text-anchor="middle" font-size="32" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">🚀</text>
<text x="450" y="104" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Let’s build something together</text>
<text x="450" y="136" text-anchor="middle" font-size="15.5" fill="#b8b4dd" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">I’m open to an internship or job opportunity — feel free to reach out!</text>
</svg>